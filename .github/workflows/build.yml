name: Build and upload binary

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (without leading 'v')"
        required: true
  push:
    tags:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Write release version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ github.event.inputs.tag }}"
          else
            version=${GITHUB_REF_NAME#v}
          fi

          echo "VERSION=$version" >> $GITHUB_ENV

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: go build -trimpath -ldflags "-s -w" -o cloudflare-dns-failover .

      - name: Upload binary to release/tag
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          overwrite: true
          tag: v${{ env.VERSION }}
          asset_name: cloudflare-dns-failover-${{ env.VERSION }}-linux-amd64
          file: cloudflare-dns-failover
